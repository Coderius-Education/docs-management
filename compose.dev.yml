# Lokale dev-stack, zelfstandig te gebruiken (géén Traefik nodig):
#   docker compose -f compose.dev.yml up
# API op :8000 (reload), delivery op :8001, Postgres op :5432.
# Frontend draait los via `pnpm dev` in frontend/ (proxy naar :8000).

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: uvicorn app.main_api:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+asyncpg://docsmgmt:docsmgmt@db:5432/docsmgmt
      SECURE_COOKIES: "false"
      BUILDS_DIR: /data/builds
      # coderius.nl -> localtest.me: informatica.localtest.me:8001/python/,
      # wo.localtest.me:8001/onderzoek/, en python.localtest.me:8001 (301).
      DOMAIN_ROOT: localtest.me
      PREVIEW_DOMAIN_SUFFIX: preview.localtest.me
      ADMIN_DOMAIN: localhost:8000
    env_file:
      - path: .env
        required: false
    ports: ["8000:8000"]
    volumes:
      - ./backend/app:/srv/app/app
      - builds-dev:/data/builds
    depends_on: [db]

  delivery:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: uvicorn app.main_delivery:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+asyncpg://docsmgmt:docsmgmt@db:5432/docsmgmt
      SECURE_COOKIES: "false"
      BUILDS_DIR: /data/builds
      # coderius.nl -> localtest.me: informatica.localtest.me:8001/python/,
      # wo.localtest.me:8001/onderzoek/, en python.localtest.me:8001 (301).
      DOMAIN_ROOT: localtest.me
      PREVIEW_DOMAIN_SUFFIX: preview.localtest.me
    env_file:
      - path: .env
        required: false
    ports: ["8001:8000"]
    volumes:
      - ./backend/app:/srv/app/app
      - builds-dev:/data/builds
    depends_on: [db]

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: docsmgmt
      POSTGRES_USER: docsmgmt
      POSTGRES_PASSWORD: docsmgmt
    ports: ["5432:5432"]
    volumes:
      - pgdata-dev:/var/lib/postgresql/data

volumes:
  builds-dev:
  pgdata-dev:
