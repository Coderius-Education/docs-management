# Productie-stack voor Portainer, achter de bestaande Traefik.
# Vereist: extern Traefik-netwerk (naam via TRAEFIK_NETWORK, default "traefik"),
# DNS voor de 12 site-domeinen + admin-domein + *.preview.coderius.nl,
# en een stack.env met de secrets (zie .env.example).

services:
  api:
    image: ghcr.io/coderius-education/docs-management:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: uvicorn app.main_api:app --host 0.0.0.0 --port 8000
    env_file: stack.env
    volumes:
      - builds:/data/builds
    networks: [internal, traefik]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik}
      - traefik.http.routers.docsadmin.rule=Host(`${ADMIN_DOMAIN:-beheer.coderius.nl}`)
      - traefik.http.routers.docsadmin.entrypoints=websecure
      - traefik.http.routers.docsadmin.tls.certresolver=leresolver
      - traefik.http.routers.docsadmin.service=docsadmin
      - traefik.http.services.docsadmin.loadbalancer.server.port=8000

  delivery:
    image: ghcr.io/coderius-education/docs-management:latest
    command: uvicorn app.main_delivery:app --host 0.0.0.0 --port 8000 --workers 2
    env_file: stack.env
    volumes:
      - builds:/data/builds:ro
    networks: [internal, traefik]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik}

      - traefik.http.routers.docsite-python-coderius-nl.rule=Host(`python.coderius.nl`)
      - traefik.http.routers.docsite-python-coderius-nl.entrypoints=websecure
      - traefik.http.routers.docsite-python-coderius-nl.tls.certresolver=leresolver
      - traefik.http.routers.docsite-python-coderius-nl.service=docsdelivery

      - traefik.http.routers.docsite-web-coderius-nl.rule=Host(`web.coderius.nl`)
      - traefik.http.routers.docsite-web-coderius-nl.entrypoints=websecure
      - traefik.http.routers.docsite-web-coderius-nl.tls.certresolver=leresolver
      - traefik.http.routers.docsite-web-coderius-nl.service=docsdelivery

      - traefik.http.routers.docsite-fullstack-coderius-nl.rule=Host(`fullstack.coderius.nl`)
      - traefik.http.routers.docsite-fullstack-coderius-nl.entrypoints=websecure
      - traefik.http.routers.docsite-fullstack-coderius-nl.tls.certresolver=leresolver
      - traefik.http.routers.docsite-fullstack-coderius-nl.service=docsdelivery

      - traefik.http.routers.docsite-robotica-coderius-nl.rule=Host(`robotica.coderius.nl`)
      - traefik.http.routers.docsite-robotica-coderius-nl.entrypoints=websecure
      - traefik.http.routers.docsite-robotica-coderius-nl.tls.certresolver=leresolver
      - traefik.http.routers.docsite-robotica-coderius-nl.service=docsdelivery

      - traefik.http.routers.docsite-ctf-coderius-nl.rule=Host(`ctf.coderius.nl`)
      - traefik.http.routers.docsite-ctf-coderius-nl.entrypoints=websecure
      - traefik.http.routers.docsite-ctf-coderius-nl.tls.certresolver=leresolver
      - traefik.http.routers.docsite-ctf-coderius-nl.service=docsdelivery

      - traefik.http.routers.docsite-embedded-coderius-nl.rule=Host(`embedded.coderius.nl`)
      - traefik.http.routers.docsite-embedded-coderius-nl.entrypoints=websecure
      - traefik.http.routers.docsite-embedded-coderius-nl.tls.certresolver=leresolver
      - traefik.http.routers.docsite-embedded-coderius-nl.service=docsdelivery

      - traefik.http.routers.docsite-editor-coderius-nl.rule=Host(`editor.coderius.nl`)
      - traefik.http.routers.docsite-editor-coderius-nl.entrypoints=websecure
      - traefik.http.routers.docsite-editor-coderius-nl.tls.certresolver=leresolver
      - traefik.http.routers.docsite-editor-coderius-nl.service=docsdelivery

      - traefik.http.routers.docsite-godot-coderius-nl.rule=Host(`godot.coderius.nl`)
      - traefik.http.routers.docsite-godot-coderius-nl.entrypoints=websecure
      - traefik.http.routers.docsite-godot-coderius-nl.tls.certresolver=leresolver
      - traefik.http.routers.docsite-godot-coderius-nl.service=docsdelivery

      - traefik.http.routers.docsite-dvwa-coderius-nl.rule=Host(`dvwa.coderius.nl`)
      - traefik.http.routers.docsite-dvwa-coderius-nl.entrypoints=websecure
      - traefik.http.routers.docsite-dvwa-coderius-nl.tls.certresolver=leresolver
      - traefik.http.routers.docsite-dvwa-coderius-nl.service=docsdelivery

      - traefik.http.routers.docsite-play-coderius-nl.rule=Host(`play.coderius.nl`)
      - traefik.http.routers.docsite-play-coderius-nl.entrypoints=websecure
      - traefik.http.routers.docsite-play-coderius-nl.tls.certresolver=leresolver
      - traefik.http.routers.docsite-play-coderius-nl.service=docsdelivery

      - traefik.http.routers.docsite-algoritmes-coderius-nl.rule=Host(`algoritmes.coderius.nl`)
      - traefik.http.routers.docsite-algoritmes-coderius-nl.entrypoints=websecure
      - traefik.http.routers.docsite-algoritmes-coderius-nl.tls.certresolver=leresolver
      - traefik.http.routers.docsite-algoritmes-coderius-nl.service=docsdelivery

      - traefik.http.routers.docsite-ide-coderius-nl.rule=Host(`ide.coderius.nl`)
      - traefik.http.routers.docsite-ide-coderius-nl.entrypoints=websecure
      - traefik.http.routers.docsite-ide-coderius-nl.tls.certresolver=leresolver
      - traefik.http.routers.docsite-ide-coderius-nl.service=docsdelivery

      # Branch-previews: per-host cert via HTTP-01 (Traefik vraagt on-demand een
      # cert aan voor elke <branch>.preview.coderius.nl die binnenkomt).
      # Uitgezet tot er een wildcard-DNS-record *.preview.coderius.nl -> Traefik-host is.
      # - traefik.http.routers.docspreview.rule=HostRegexp(`^.+\.preview\.coderius\.nl$`)
      # - traefik.http.routers.docspreview.entrypoints=websecure
      # - traefik.http.routers.docspreview.tls.certresolver=leresolver
      # - traefik.http.routers.docspreview.service=docsdelivery
      - traefik.http.services.docsdelivery.loadbalancer.server.port=8000

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: docsmgmt
      POSTGRES_USER: docsmgmt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?zet POSTGRES_PASSWORD in stack.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docsmgmt -d docsmgmt"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  builds:
  pgdata:

networks:
  internal: {}
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}
