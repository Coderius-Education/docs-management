# Productie-stack voor Portainer, achter de bestaande Traefik.
# Vereist: extern Traefik-netwerk (naam via TRAEFIK_NETWORK, default "traefik"),
# DNS voor coderius.nl, *.coderius.nl (vak-domeinen, oude subdomeinen, admin) en
# *.preview.coderius.nl, de certresolver `lednsresolver` (DNS-01, Hetzner) op de
# externe Traefik, en een stack.env met de secrets (zie .env.example).

services:
  api:
    image: ghcr.io/coderius-education/docs-management:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: uvicorn app.main_api:app --host 0.0.0.0 --port 8000
    env_file: stack.env
    volumes:
      - builds:/data/builds
    networks: [internal, traefik]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik}
      - traefik.http.routers.docsadmin.rule=Host(`${ADMIN_DOMAIN:-beheer.coderius.nl}`)
      # Wint van de wildcard-router van delivery (die ook beheer.coderius.nl matcht).
      - traefik.http.routers.docsadmin.priority=1000
      - traefik.http.routers.docsadmin.entrypoints=websecure
      - traefik.http.routers.docsadmin.tls.certresolver=leresolver
      - traefik.http.routers.docsadmin.service=docsadmin
      - traefik.http.services.docsadmin.loadbalancer.server.port=8000

  delivery:
    image: ghcr.io/coderius-education/docs-management:latest
    command: uvicorn app.main_delivery:app --host 0.0.0.0 --port 8000 --workers 2
    env_file: stack.env
    volumes:
      - builds:/data/builds:ro
    networks: [internal, traefik]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik}

      # Eén router voor de apex, elk vak-domein (informatica., wo., …) en de oude
      # cursus-subdomeinen (python., web., … → 301 naar <vak>/<path>/). Welke
      # site bij welke host/pad hoort bepaalt de delivery-app uit sites.json, dus
      # een nieuwe site of een nieuw vak vraagt geen wijziging hier.
      # Eén wildcard-cert (coderius.nl + *.coderius.nl) via DNS-01 (lednsresolver).
      # beheer.coderius.nl valt ook onder de regex, maar de docsadmin-router heeft
      # een hogere prioriteit.
      - traefik.http.routers.docsite.rule=HostRegexp(`^([a-z0-9-]+\.)?coderius\.nl$`)
      - traefik.http.routers.docsite.priority=10
      - traefik.http.routers.docsite.entrypoints=websecure
      - traefik.http.routers.docsite.tls.certresolver=lednsresolver
      - traefik.http.routers.docsite.tls.domains[0].main=coderius.nl
      - traefik.http.routers.docsite.tls.domains[0].sans=*.coderius.nl
      - traefik.http.routers.docsite.service=docsdelivery

      # Previews: <branch>--<vak>.preview.coderius.nl/<path>/. Eigen wildcard-cert
      # (*.preview.coderius.nl), want *.coderius.nl dekt maar één label.
      - traefik.http.routers.docspreview.rule=HostRegexp(`^.+\.preview\.coderius\.nl$`)
      - traefik.http.routers.docspreview.priority=20
      - traefik.http.routers.docspreview.entrypoints=websecure
      - traefik.http.routers.docspreview.tls.certresolver=lednsresolver
      - traefik.http.routers.docspreview.tls.domains[0].main=preview.coderius.nl
      - traefik.http.routers.docspreview.tls.domains[0].sans=*.preview.coderius.nl
      - traefik.http.routers.docspreview.service=docsdelivery
      - traefik.http.services.docsdelivery.loadbalancer.server.port=8000

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: docsmgmt
      POSTGRES_USER: docsmgmt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?zet POSTGRES_PASSWORD in stack.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docsmgmt -d docsmgmt"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  builds:
  pgdata:

networks:
  internal: {}
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}
